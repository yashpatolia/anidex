name: Deploy

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # VPS is arm64 (aarch64); this runs natively on a free hosted ARM64
    # runner (public repo) instead of cross-building via QEMU emulation,
    # which was ~4x slower. Switch back to ubuntu-latest + QEMU if the VPS
    # architecture ever changes to amd64.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # cache-to/cache-from: type=gha (below) needs Buildx's docker-container
      # driver — the default docker driver can't export to that cache backend.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Without this, every push rebuilds from a cold cache — npm ci runs
          # twice from scratch (deps + prod-deps stages) and the Next.js
          # build gets no layer reuse, even when package-lock.json didn't
          # change. GHA cache persists layers between workflow runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # build-push-action v6 generates a build provenance attestation by
          # default (an extra "resolving provenance" step + manifest on
          # every build). Useful for supply-chain verification, not
          # something this single-VPS personal deploy needs.
          provenance: false

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR }}
            echo "IMAGE=${{ needs.build-and-push.outputs.image }}" > .env.image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose --env-file .env --env-file .env.image pull app
            docker compose --env-file .env --env-file .env.image up -d
            # -a (not just prune's default dangling-only cleanup): every
            # deploy tags its image with the unique commit SHA, so the
            # *previous* deploy's image is still fully tagged, not dangling
            # — plain `docker image prune -f` would never touch it and old
            # images (500+MB each) would accumulate on disk forever.
            docker image prune -a -f
